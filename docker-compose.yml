services:
  kerberos-webapp-api:
    build:
      context: .
      dockerfile: src/backend/KerberosWebApp.Api/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      KRB5_CONFIG: /etc/krb5.conf
      KRB5_KTNAME: /etc/security/keytabs/app.keytab
    ports:
      - "8081:8080"
    volumes:
      - ./deploy/local/krb5.conf:/etc/krb5.conf:ro
      - ./deploy/local/app.keytab:/etc/security/keytabs/app.keytab:ro

  kerberos-webapp-ui:
    build:
      context: .
      dockerfile: src/frontend/Dockerfile
    depends_on:
      - kerberos-webapp-api
    ports:
      - "8080:8080"
