apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: kerberos-webapp
  annotations:
    nginx.ingress.kubernetes.io/proxy-buffer-size: "16k"
    nginx.ingress.kubernetes.io/proxy-read-timeout: "120"
    nginx.ingress.kubernetes.io/proxy-send-timeout: "120"
spec:
  ingressClassName: nginx
  tls:
    - hosts:
        - app.example.com
      secretName: kerberos-webapp-tls
  rules:
    - host: app.example.com
      http:
        paths:
          - path: /api
            pathType: Prefix
            backend:
              service:
                name: kerberos-webapp-api
                port:
                  number: 8080
          - path: /health
            pathType: Prefix
            backend:
              service:
                name: kerberos-webapp-api
                port:
                  number: 8080
          - path: /
            pathType: Prefix
            backend:
              service:
                name: kerberos-webapp-ui
                port:
                  number: 8080
