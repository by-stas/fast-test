apiVersion: v1
kind: Secret
metadata:
  name: kerberos-webapp-keytab
  namespace: kerberos-webapp
type: Opaque
stringData:
  README: |
    Do not commit real keytab data. Create the production secret with:

      ./scripts/create-keytab-secret.sh ./svc-webapp-kerberos.keytab

    The backend expects the keytab file at:

      /etc/security/keytabs/app.keytab
