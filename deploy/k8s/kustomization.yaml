apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: kerberos-webapp

resources:
  - namespace.yaml
  - krb5-configmap.yaml
  - backend-deployment.yaml
  - backend-service.yaml
  - frontend-deployment.yaml
  - frontend-service.yaml
  - ingress.yaml

images:
  - name: ghcr.io/example/kerberos-webapp-api
    newName: ghcr.io/example/kerberos-webapp-api
    newTag: latest
  - name: ghcr.io/example/kerberos-webapp-ui
    newName: ghcr.io/example/kerberos-webapp-ui
    newTag: latest
